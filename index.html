<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi Cine">
<title>Mi Cine</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--card2:#232731;--txt:#e9ecf1;--mut:#9aa3b2;--acc:#e5484d;--rad:12px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 20px;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222}
  header h1{font-size:20px;margin:0 auto 0 0;letter-spacing:.5px}
  header h1 span{color:var(--acc)}
  #who{font-size:14px}
  .ulist{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
  .urow{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
  .urow .n{font-weight:600;margin-right:auto}
  .tag{font-size:11px;border:1px solid #445;border-radius:4px;padding:1px 6px;color:var(--mut);margin-left:6px;font-weight:400}
  .urow button{padding:5px 10px;font-size:13px}
  .danger{border-color:#7a2f33 !important;color:#ff9a9d}
  .acct input{background:var(--bg);border:1px solid #2c313c;color:var(--txt);border-radius:8px;padding:10px;font-size:15px;width:100%}
  .acct .f{display:flex;gap:8px;margin:8px 0}
  .acct h3{margin:18px 0 6px} .acct h2{margin:0 0 4px}
  .share{background:var(--bg);border:1px dashed #445;border-radius:10px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:14px;margin:10px 0}
  .ok{color:#7fd88f;font-size:14px;min-height:1.2em}
  input[type=search]{background:var(--card);border:1px solid #2c313c;color:var(--txt);border-radius:999px;padding:9px 16px;width:min(320px,40vw);font-size:14px}
  button{background:var(--card2);color:var(--txt);border:1px solid #333a47;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  button:hover{border-color:#566}
  button.pri{background:var(--acc);border-color:var(--acc);font-weight:600}
  main{padding:20px;margin:0 auto}
  .center{text-align:center;padding:60px 20px;color:var(--mut)}
  .center h2{color:var(--txt)}
  form.login{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw);margin:24px auto 0}
  form.login input{background:var(--card);border:1px solid #2c313c;color:var(--txt);border-radius:8px;padding:12px;font-size:16px}
  .err{color:#ff8a8d;min-height:1.2em;font-size:14px}
  h3.sec{margin:28px 0 12px;font-size:16px;color:var(--mut);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .card{background:var(--card);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:transform .15s;position:relative}
  .card:hover{transform:translateY(-3px)}
  .poster{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:12px;font-weight:700;font-size:17px;line-height:1.2}
  .meta{padding:8px 12px 12px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
  .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
  #player{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
  #player.on{display:flex}
  #pbar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#111}
  #pbar .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  #stage video{width:100%;height:100%;background:#000}
  #iosTip{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--card2);border:1px solid #333a47;border-radius:12px;padding:14px 40px 14px 14px;font-size:14px;line-height:1.4}
  #iosTip b{color:var(--acc)} #iosTip button{position:absolute;top:8px;right:8px;padding:2px 9px}
  header{padding-top:max(14px,env(safe-area-inset-top))}
  .poster.img{background-size:cover;background-position:center;font-size:0;padding:0}
  .ttl{padding:8px 10px 0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl:empty{display:none}
  #info{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px}
  #info.on{display:flex}
  #info .box{background:var(--card);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;display:flex;gap:18px;padding:18px}
  #info img{width:200px;border-radius:10px;align-self:flex-start;flex-shrink:0}
  #info h2{margin:0 0 6px}
  #info .sub{color:var(--mut);font-size:14px;margin-bottom:12px}
  #info p{line-height:1.5;color:#cfd5df;margin:0 0 16px}
  #info .acts{display:flex;gap:10px;flex-wrap:wrap}
  /* --- Portada estilo Netflix --- */
  .hero{position:relative;margin:-20px -20px 8px;min-height:min(62vh,560px);display:flex;align-items:flex-end;background:#000 center/cover no-repeat}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,17,21,.95) 0%,rgba(15,17,21,.6) 45%,rgba(15,17,21,0) 75%),linear-gradient(0deg,var(--bg) 0%,rgba(15,17,21,0) 40%)}
  .hero .hc{position:relative;z-index:1;padding:40px 4vw 48px;max-width:640px}
  .hero h2{font-size:clamp(28px,4.5vw,52px);margin:0 0 10px;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero .hs{color:#cfd5df;font-size:14px;margin-bottom:12px}
  .hero .hs .g{border:1px solid #556;border-radius:4px;padding:1px 6px;margin-left:6px;font-size:12px}
  .hero p{color:#dfe3ea;line-height:1.5;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hero .acts{display:flex;gap:10px}
  .hero .acts button{padding:11px 22px;font-size:16px;font-weight:600;border-radius:6px}
  .hero .acts .w{background:#fff;color:#000;border-color:#fff}
  .hero .acts .gr{background:rgba(110,118,135,.55);border-color:transparent}
  .rowwrap{position:relative;margin:0 -20px}
  .row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(130px,13vw,190px);gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 20px 10px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row .card{scroll-snap-align:start}
  .arr{position:absolute;top:4px;bottom:10px;width:44px;z-index:2;border:0;border-radius:0;background:rgba(15,17,21,.75);font-size:26px;opacity:0;transition:opacity .2s}
  .rowwrap:hover .arr{opacity:1} .arr.l{left:0} .arr.r{right:0}
  @media (hover:none){.arr{display:none}}
  #castBar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#1d2029;border-top:1px solid #333a47;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;gap:12px;align-items:center}
  #castBar.on{display:flex}
  #castBar img{width:40px;height:60px;object-fit:cover;border-radius:4px}
  #castBar .ct{flex:1;min-width:0}
  #castBar .ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #castBar .ct small{color:var(--mut)}
  #castBar input[type=range]{width:100%;accent-color:var(--acc)}
  #castBar button{padding:6px 10px}
  body.casting main{padding-bottom:120px}
  @media (max-width:600px){header{flex-wrap:wrap} input[type=search]{order:9;width:100%}
    .grid{grid-template-columns:repeat(3,1fr);gap:10px} .poster{font-size:13px;padding:8px} .meta{padding:6px 8px 8px;font-size:11px} .ttl{font-size:12px;padding:6px 8px 0}
    .hero{min-height:70vh;background-position:center top} .hero::after{background:linear-gradient(0deg,var(--bg) 0%,rgba(15,17,21,.75) 45%,rgba(15,17,21,.15) 100%)}
    .hero .hc{padding:24px 16px 28px;text-align:center;margin:0 auto} .hero .acts{justify-content:center} .hero p{font-size:14px}
    .row{grid-auto-columns:31%;gap:8px;padding:4px 20px 8px}
    #info .box{flex-direction:column;align-items:center;text-align:center} #info img{width:150px;align-self:center} #info .acts{justify-content:center}}
</style>
</head>
<body>
<header>
  <h1>Mi <span>Cine</span></h1>
  <input type="search" id="q" placeholder="Buscar película…" hidden>
  <button id="who" hidden></button>
  <button id="btnInstall" class="pri" hidden>Instalar app</button>

</header>
<main id="app"><div class="center">Cargando…</div></main>
<div id="info"><div class="box"></div></div>
<div id="castBar">
  <img id="cbImg" alt="" hidden>
  <div class="ct"><b id="cbTitle"></b><small id="cbDev"></small>
    <input type="range" id="cbSeek" min="0" max="100" value="0" step="1"></div>
  <button id="cbBack" title="Retroceder 10 s">⟲10</button>
  <button id="cbPlay" title="Pausa">⏸</button>
  <button id="cbFwd" title="Adelantar 30 s">30⟳</button>
  <button id="cbStop" title="Dejar de transmitir">✕</button>
</div>

<div id="player">
  <div id="pbar">
    <button id="btnBack">← Volver</button>
    <span class="t" id="ptitle"></span>
  </div>
  <div id="stage"></div>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const WORKER_URL = "https://micine.koke-17-21.workers.dev"; // ej: https://micine.tu-cuenta.workers.dev
/* ======================================= */

const API = "https://www.googleapis.com/drive/v3";
const VIDEO_EXT = /\.(mp4|m4v|mkv|webm|avi|mov|wmv|mpg|mpeg|ts)$/i;

const $ = s => document.querySelector(s);
const app = $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("micine:"+k); return v===null?d:JSON.parse(v);}catch{return d;} },
  set(k, v){ try{ localStorage.setItem("micine:"+k, JSON.stringify(v)); }catch{} }
};

let token = null, tokenExp = 0, folderId = null, user = null, movies = [], current = null;

/* ---------- Service worker (streaming con autorización) ---------- */
const swReady = "serviceWorker" in navigator
  ? navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).catch(e => { console.warn("SW", e); return null; })
  : Promise.resolve(null);
navigator.serviceWorker?.addEventListener("message", async e => {
  if (e.data?.type === "needToken" && e.ports[0]) {
    try { await ensureToken(); } catch {}
    e.ports[0].postMessage(token);
  }
});
async function sendTokenToSW(){
  const reg = await swReady;
  const sw = reg && (reg.active || navigator.serviceWorker.controller);
  if (sw) sw.postMessage({ type: "token", token });
}

/* ---------- Sesión con usuario propio ---------- */
async function ensureToken(){
  if (token && Date.now() < tokenExp) return;
  const session = store.get("session", null);
  if (!session) { showLogin(); throw new Error("nologin"); }
  const r = await fetch(WORKER_URL + "/token", { headers: { Authorization: "Bearer " + session } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout("Tu sesión expiró. Vuelve a entrar."); throw new Error("nologin"); }
  if (!r.ok) throw new Error(j.error || ("Servidor " + r.status));
  token = j.access_token; tokenExp = Date.now() + (j.expires_in - 60) * 1000;
  folderId = j.folder; user = j.user; isAdmin = !!j.admin; isFixed = !!j.fixed;
  await sendTokenToSW();
}
function showLogin(msg){
  ["#q","#who"].forEach(s => $(s).hidden = true);
  app.innerHTML = `<div class="center"><h2>Bienvenido a Mi Cine</h2>
    <form class="login" id="flogin" autocomplete="on">
      <input id="lu" name="username" placeholder="Usuario" autocomplete="username" autocapitalize="none" required>
      <input id="lp" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="pri" type="submit">Entrar</button>
      <div class="err" id="lerr">${msg || ""}</div>
    </form></div>`;
  $("#flogin").onsubmit = async e => {
    e.preventDefault();
    $("#lerr").textContent = "Entrando…";
    try {
      const r = await fetch(WORKER_URL + "/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: $("#lu").value, pass: $("#lp").value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $("#lerr").textContent = j.error || "No se pudo entrar"; return; }
      store.set("session", j.session);
      start();
    } catch { $("#lerr").textContent = "No hay conexión con el servidor."; }
  };
}
function logout(msg){
  store.set("session", null); token = null; tokenExp = 0; sendTokenToSW();
  showLogin(msg);
}
/* ---------- Mi cuenta y administración de usuarios ---------- */
let isAdmin = false, isFixed = false;
$("#who").onclick = () => showAccount();
async function wapi(path, opts = {}){
  const r = await fetch(WORKER_URL + path, { ...opts, headers: { "Content-Type": "application/json",
    Authorization: "Bearer " + store.get("session", ""), ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
function genPass(){
  const w = ["sol","luna","rio","mar","nube","pino","faro","lago","roca","ola","tigre","puma","cielo","isla"];
  const a = crypto.getRandomValues(new Uint32Array(3));
  return w[a[0] % w.length] + "-" + w[a[1] % w.length] + "-" + (100 + a[2] % 900);
}
function closeInfo(){ $("#info").classList.remove("on"); }
async function showAccount(){
  const box = $("#info .box");
  box.innerHTML = `<div class="acct" style="width:100%">
    <h2>👤 ${esc(user)}</h2><div class="sub" style="color:var(--mut)">${isAdmin ? "Administrador" : "Usuario"}</div>
    ${isFixed ? "" : `<h3>Cambiar mi contraseña</h3>
      <div class="f"><input type="password" id="aOld" placeholder="Contraseña actual" autocomplete="current-password"></div>
      <div class="f"><input type="password" id="aNew" placeholder="Contraseña nueva (mín. 6)" autocomplete="new-password"><button id="aSave">Guardar</button></div>
      <div class="ok" id="aMsg"></div>`}
    ${isAdmin ? `<h3>Usuarios</h3><div class="ulist" id="uList"><div style="color:var(--mut)">Cargando…</div></div>
      <h3>Agregar usuario</h3>
      <div class="f"><input id="nName" placeholder="Nombre (ej: mama)" autocapitalize="none" autocomplete="off"></div>
      <div class="f"><input id="nPass" placeholder="Contraseña" autocomplete="off"><button id="nGen" title="Generar una">🎲</button></div>
      <button class="pri" id="nAdd">Agregar</button><div class="err" id="nMsg"></div><div id="nShare"></div>` : ""}
    <div class="acts" style="margin-top:18px"><button class="danger" id="aOut">Cerrar sesión</button><button id="aClose">Cerrar</button></div>
  </div>`;
  $("#info").classList.add("on");
  $("#aClose").onclick = closeInfo;
  $("#aOut").onclick = () => { closeInfo(); logout("Sesión cerrada."); };
  if (!isFixed) $("#aSave").onclick = async () => {
    $("#aMsg").className = "ok"; $("#aMsg").textContent = "Guardando…";
    try {
      const j = await wapi("/me/password", { method: "POST", body: JSON.stringify({ old: $("#aOld").value, pass: $("#aNew").value }) });
      store.set("session", j.session); $("#aOld").value = $("#aNew").value = "";
      $("#aMsg").textContent = "✓ Contraseña cambiada. Se cerró la sesión en tus otros dispositivos.";
    } catch (e) { $("#aMsg").className = "err"; $("#aMsg").textContent = e.message; }
  };
  if (!isAdmin) return;
  $("#nGen").onclick = () => { $("#nPass").value = genPass(); };
  $("#nAdd").onclick = async () => {
    const name = $("#nName").value.trim().toLowerCase(), pass = $("#nPass").value;
    $("#nMsg").textContent = ""; $("#nShare").innerHTML = "";
    try {
      await wapi("/admin/users", { method: "POST", body: JSON.stringify({ name, pass }) });
      $("#nName").value = $("#nPass").value = "";
      shareCard($("#nShare"), name, pass, "✓ Usuario creado. Envíale esto:");
      loadUsers();
    } catch (e) { $("#nMsg").textContent = e.message; }
  };
  loadUsers();
}
function shareCard(el, name, pass, title){
  const txt = `🍿 Mi Cine\nhttps://jorgeflore.github.io/micine/\nUsuario: ${name}\nContraseña: ${pass}`;
  el.innerHTML = `<div class="ok">${esc(title)}</div><div class="share">${esc(txt)}</div>
    <div class="f"><button class="cp">📋 Copiar</button>
    <a href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><button>WhatsApp</button></a></div>`;
  el.querySelector(".cp").onclick = async e => {
    try { await navigator.clipboard.writeText(txt); e.target.textContent = "✓ Copiado"; } catch { e.target.textContent = "Selecciona y copia"; }
  };
}
async function loadUsers(){
  const el = $("#uList");
  try {
    const list = await wapi("/admin/users");
    el.innerHTML = list.map(u => `<div class="urow" data-n="${esc(u.name)}">
      <span class="n">${esc(u.name)}${u.admin ? '<span class="tag">admin</span>' : ""}${u.fixed ? '<span class="tag">fijo</span>' : ""}</span>
      ${u.fixed ? "" : `<button class="pw">🔑 Clave</button><button class="del danger">Eliminar</button>`}
      <div class="slot" style="width:100%"></div></div>`).join("");
    el.querySelectorAll(".urow").forEach(row => {
      const n = row.dataset.n, slot = row.querySelector(".slot");
      const pw = row.querySelector(".pw"), del = row.querySelector(".del");
      if (pw) pw.onclick = () => {
        slot.innerHTML = `<div class="f"><input class="np" placeholder="Nueva contraseña" value="${genPass()}"><button class="sv">Guardar</button></div><div class="err m"></div><div class="sh"></div>`;
        slot.querySelector(".sv").onclick = async () => {
          const pass = slot.querySelector(".np").value;
          try {
            await wapi("/admin/users/" + encodeURIComponent(n) + "/password", { method: "POST", body: JSON.stringify({ pass }) });
            slot.innerHTML = ""; shareCard(slot, n, pass, "✓ Clave cambiada (se cerró su sesión en todos lados). Envíale esto:");
          } catch (e) { slot.querySelector(".m").textContent = e.message; }
        };
      };
      if (del) del.onclick = () => {
        slot.innerHTML = `<div class="f" style="align-items:center"><span style="margin-right:auto">¿Eliminar a <b>${esc(n)}</b> y su avance?</span>
          <button class="danger y">Sí, eliminar</button><button class="no">No</button></div>`;
        slot.querySelector(".no").onclick = () => { slot.innerHTML = ""; };
        slot.querySelector(".y").onclick = async () => {
          try { await wapi("/admin/users/" + encodeURIComponent(n), { method: "DELETE" }); loadUsers(); }
          catch (e) { slot.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
        };
      };
    });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------- Drive API ---------- */
async function api(path, params = {}, retry = true){
  await ensureToken();
  const r = await fetch(API + path + "?" + new URLSearchParams(params), { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401 && retry) { token = null; return api(path, params, false); }
  if (!r.ok) throw new Error("Drive " + r.status + ": " + (await r.text()).slice(0, 200));
  return r;
}
async function listChildren(id){
  let out = [], pageToken;
  do {
    const p = { q: `'${id}' in parents and trashed=false`, pageSize: 1000,
      fields: "nextPageToken,files(id,name,mimeType,size,createdTime,videoMediaMetadata(durationMillis))",
      supportsAllDrives: true, includeItemsFromAllDrives: true };
    if (pageToken) p.pageToken = pageToken;
    const j = await (await api("/files", p)).json();
    out.push(...j.files); pageToken = j.nextPageToken;
  } while (pageToken);
  return out;
}
async function scan(id, depth = 0, acc = { videos: [], subs: [], imgs: [] }){
  const items = await listChildren(id), sub = [];
  for (const f of items) {
    if (f.mimeType === "application/vnd.google-apps.folder") { if (depth < 4) sub.push(scan(f.id, depth + 1, acc)); }
    else if (f.mimeType.startsWith("video/") || VIDEO_EXT.test(f.name)) acc.videos.push({ ...f, folder: id });
    else if (/\.(srt|vtt)$/i.test(f.name)) acc.subs.push({ ...f, folder: id });
    else if (/\.(jpe?g|png|webp)$/i.test(f.name)) acc.imgs.push({ ...f, folder: id });
  }
  await Promise.all(sub);
  return acc;
}

/* ---------- Biblioteca ---------- */
async function start(){
  if (WORKER_URL.startsWith("PEGA_")) {
    app.innerHTML = `<div class="center"><h2>Falta configurar</h2><p>Pega la URL del Worker en <code>WORKER_URL</code> dentro de index.html.</p></div>`;
    return;
  }
  if (!store.get("session", null)) return showLogin();
  app.innerHTML = `<div class="center">Cargando tus películas…</div>`;
  try {
    await ensureToken();
    ["#q","#who"].forEach(s => $(s).hidden = false);
    $("#who").textContent = "👤 " + user;
    const { videos, subs, imgs } = await scan(folderId);
    movies = videos.map(v => {
      const base = v.name.replace(/\.[^.]+$/, "");
      const lb = base.toLowerCase();
      const here = subs.filter(s => s.folder === v.folder);
      const exact = here.filter(s => s.name.toLowerCase().startsWith(lb));
      const alone = videos.filter(x => x.folder === v.folder).length === 1;
      // Carátula propia: imagen con el mismo nombre, o poster/cover/folder.jpg en su carpeta
      const pics = imgs.filter(i => i.folder === v.folder);
      const pic = pics.find(i => i.name.replace(/\.[^.]+$/, "").toLowerCase() === lb)
        || (alone && (pics.find(i => /^(poster|cover|folder|caratula)\./i.test(i.name)) || (pics.length === 1 && pics[0])));
      const title = cleanTitle(base);
      const ym = title.match(/^(.*?)[\s(\[-]*((?:19|20)\d\d)[)\]]?$/);
      return { ...v, title, q: ym ? ym[1].trim() : title, year: ym ? ym[2] : "",
        pic: pic || null, subs: exact.length ? exact : (alone ? here : []) };
    }).sort((a, b) => a.title.localeCompare(b.title, "es"));
    render();
    if (await pullProgress()) render();
    loadPosters();
  } catch (e) {
    if (e.message === "nologin") return;
    console.error(e);
    app.innerHTML = `<div class="center"><h2>No pude cargar las películas</h2><p>${esc(e.message)}</p><button onclick="start()">Reintentar</button></div>`;
  }
}
function cleanTitle(s){
  return s.replace(/[._]/g, " ")
    .replace(/\b(1080p|720p|2160p|4k|x264|x265|h264|h265|hevc|bluray|brrip|webrip|web-dl|hdrip|dvdrip|aac|ac3|dts|latino|castellano|dual|subs?)\b.*$/i, "")
    .replace(/\s+/g, " ").trim();
}
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function fmtSize(b){ b = +b || 0; return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB"; }
function fmtDur(ms){ if (!ms) return ""; const m = Math.round(ms / 60000); return Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
/* ---------- Avance ("Seguir viendo"), sincronizado entre dispositivos ---------- */
const progKey = id => "prog:" + user + ":" + id;
function getProg(id){
  const v = store.get(progKey(id), null);
  if (v) return v;
  return { p: store.get("pos:" + user + ":" + id, 0), d: store.get("done:" + user + ":" + id, false), t: 0 };
}
let pendingProg = {}, progTimer = null;
function setProg(id, p, d){
  const v = { p: Math.floor(p), d: !!d, t: Date.now() };
  store.set(progKey(id), v); pendingProg[id] = v;
  if (!progTimer) progTimer = setTimeout(flushProgress, 20000);
}
function flushProgress(leaving){
  clearTimeout(progTimer); progTimer = null;
  const items = Object.entries(pendingProg).map(([id, v]) => ({ id, p: v.p, d: v.d, t: v.t }));
  const session = store.get("session", null);
  if (!items.length || !session) return;
  pendingProg = {};
  fetch(WORKER_URL + "/progress", { method: "POST", keepalive: !!leaving,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + session },
    body: JSON.stringify(items) })
    .then(r => { if (!r.ok && r.status !== 501) throw 0; })
    .catch(() => { for (const it of items) if (!pendingProg[it.id]) pendingProg[it.id] = it; });
}
async function pullProgress(){
  try {
    const r = await fetch(WORKER_URL + "/progress", { headers: { Authorization: "Bearer " + store.get("session", "") } });
    if (!r.ok) return false;
    let changed = false;
    for (const row of await r.json()) {
      const loc = store.get(progKey(row.id), null);
      if (!loc || row.t > loc.t) { store.set(progKey(row.id), { p: row.p, d: row.d, t: row.t }); changed = true; }
    }
    return changed;
  } catch { return false; }
}
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { saveNow(); flushProgress(true); return; }
  if (movies.length && !$("#player").classList.contains("on") && await pullProgress()) render();
});

function cardHTML(m){
  const p = getProg(m.id).p;
  const dur = +m.videoMediaMetadata?.durationMillis || 0;
  const pct = p && dur ? Math.min(100, p * 1000 / dur * 100) : 0;
  const h = hue(m.title);
  const img = posterOf(m);
  return `<div class="card" data-id="${m.id}">
    <div class="poster${img ? " img" : ""}" style="background:${img ? `url('${img}')` : `linear-gradient(160deg,hsl(${h} 45% 32%),hsl(${(h + 40) % 360} 50% 14%))`};${img ? "background-size:cover;background-position:center" : ""}">${esc(m.q)}</div>
    <div class="ttl">${img ? esc(m.q) : ""}</div>
    <div class="meta"><span>${[m.year || metaOf(m)?.year, fmtDur(dur)].filter(Boolean).join(" · ")}</span><span>${fmtSize(m.size)}</span></div>
    ${pct ? `<div class="prog" style="width:${pct}%"></div>` : ""}</div>`;
}

/* ---------- Carátulas ---------- */
const picUrls = {}; // id de película → URL de su imagen propia de Drive
const metaKey = m => "meta3:" + m.q.toLowerCase() + "|" + m.year;
const metaOf = m => store.get(metaKey(m), null);
const posterOf = m => picUrls[m.id] || metaOf(m)?.poster || null;
function refreshCard(m){
  document.querySelectorAll(`.card[data-id="${m.id}"]`).forEach(c => {
    const tmp = document.createElement("div"); tmp.innerHTML = cardHTML(m);
    const n = tmp.firstElementChild; n.onclick = c.onclick; c.replaceWith(n);
  });
}
async function loadPosters(){
  const queue = movies.slice();
  const worker = async () => {
    for (let m; (m = queue.shift()); ) {
      try {
        if (m.pic && !picUrls[m.id]) {
          const blob = await (await api("/files/" + m.pic.id, { alt: "media" })).blob();
          picUrls[m.id] = URL.createObjectURL(blob); refreshCard(m);
        }
        if (!metaOf(m)) {
          const r = await fetch(`${WORKER_URL}/meta?q=${encodeURIComponent(m.q)}&y=${m.year}`,
            { headers: { Authorization: "Bearer " + store.get("session", "") } });
          if (r.status === 501) return; // sin TMDB_KEY configurada
          if (r.ok) { store.set(metaKey(m), await r.json()); refreshCard(m); }
        }
      } catch (e) { console.warn("carátula", m.title, e); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (movies.some(m => metaOf(m)) && !$("#q").value && !$("#player").classList.contains("on")) {
    const y = scrollY; render(); scrollTo(0, y);
  }
}

/* ---------- Ficha de la película ---------- */
function showInfo(m){
  const meta = metaOf(m) || {}, img = posterOf(m);
  const dur = fmtDur(+m.videoMediaMetadata?.durationMillis || 0);
  const pr = getProg(m.id), pos = pr.p;
  const sub = [meta.year || m.year, dur, meta.rating ? "⭐ " + meta.rating : "", m.subs.length ? "Subtítulos" : ""].filter(Boolean).join(" · ");
  $("#info .box").innerHTML = `
    ${img ? `<img src="${img}" alt="">` : ""}
    <div><h2>${esc(meta.title || m.title)}</h2><div class="sub">${esc(sub)}</div>
      <p>${esc(meta.overview || "Sin sinopsis.")}</p>
      <div class="acts">
        <button class="pri" id="iPlay">▶ ${pos > 60 && !pr.d ? "Continuar" : "Ver"}</button>
        ${castAvailable() ? `<button id="iCast">📺 Ver en la TV</button>` : ""}
        ${pos > 60 ? `<button id="iRestart">Desde el inicio</button>` : ""}
        <button id="iClose">Cerrar</button>
      </div></div>`;
  $("#info").classList.add("on");
  const close = () => $("#info").classList.remove("on");
  $("#iClose").onclick = close;
  $("#iPlay").onclick = () => { close(); play(m); };
  if ($("#iCast")) $("#iCast").onclick = () => { close(); castMovie(m); };
  if ($("#iRestart")) $("#iRestart").onclick = () => { setProg(m.id, 0, false); close(); play(m); };
}
$("#info").onclick = e => { if (e.target.id === "info") $("#info").classList.remove("on"); };
let heroId = null;
function pickHero(cont){
  if (heroId && movies.some(m => m.id === heroId)) return movies.find(m => m.id === heroId);
  const withArt = movies.filter(m => metaOf(m)?.backdrop);
  if (!withArt.length) return null;
  // Prioriza lo que estás viendo; si no, una al azar entre las más nuevas
  const pool = cont.filter(m => metaOf(m)?.backdrop);
  const recent = withArt.slice().sort((a, b) => (b.createdTime || "").localeCompare(a.createdTime || "")).slice(0, 6);
  const m = pool[0] || recent[Math.floor(Math.random() * recent.length)];
  heroId = m.id; return m;
}
function heroHTML(m){
  const meta = metaOf(m) || {}, pr = getProg(m.id);
  const dur = fmtDur(+m.videoMediaMetadata?.durationMillis || 0);
  const bits = [meta.year || m.year, dur, meta.rating ? "⭐ " + meta.rating : ""].filter(Boolean).join(" · ");
  const g = (meta.genres || []).slice(0, 2).map(x => `<span class="g">${esc(x)}</span>`).join("");
  return `<section class="hero" style="background-image:url('${meta.backdrop}')"><div class="hc">
    <h2>${esc(meta.title || m.q)}</h2><div class="hs">${esc(bits)}${g}</div>
    <p>${esc(meta.overview || "")}</p>
    <div class="acts"><button class="w" id="hPlay">▶ ${pr.p > 60 && !pr.d ? "Continuar" : "Ver"}</button>
    <button class="gr" id="hInfo">ⓘ Más info</button></div></div></section>`;
}
function rowHTML(title, list){
  if (!list.length) return "";
  return `<h3 class="sec">${esc(title)}</h3><div class="rowwrap"><button class="arr l">‹</button>
    <div class="row">${list.map(cardHTML).join("")}</div><button class="arr r">›</button></div>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  if (!movies.length) { app.innerHTML = `<div class="center"><h2>Todavía no hay películas</h2><p>Súbelas a la carpeta de Drive y recarga.</p></div>`; return; }
  const bind = () => app.querySelectorAll(".card").forEach(c => c.onclick = () => showInfo(movies.find(m => m.id === c.dataset.id)));
  if (q) {
    const list = movies.filter(m => (m.title + " " + (metaOf(m)?.title || "")).toLowerCase().includes(q));
    app.innerHTML = `<h3 class="sec">Resultados (${list.length})</h3><div class="grid">${list.map(cardHTML).join("")}</div>`;
    return bind();
  }
  const cont = movies.filter(m => { const pr = getProg(m.id); return pr.p > 60 && !pr.d; })
    .sort((a, b) => getProg(b.id).t - getProg(a.id).t);
  const recent = movies.slice().sort((a, b) => (b.createdTime || "").localeCompare(a.createdTime || "")).slice(0, 12);
  const byGenre = {};
  for (const m of movies) for (const g of metaOf(m)?.genres || []) (byGenre[g] ||= []).push(m);
  const genres = Object.entries(byGenre).filter(([, l]) => l.length >= 2 || movies.length < 12)
    .sort((a, b) => b[1].length - a[1].length).slice(0, 8);
  const hero = pickHero(cont);
  app.innerHTML =
    (hero ? heroHTML(hero) : "") +
    rowHTML("Seguir viendo", cont) +
    rowHTML("Agregadas recientemente", recent) +
    genres.map(([g, l]) => rowHTML(g, l)).join("") +
    `<h3 class="sec">Todas (${movies.length})</h3><div class="grid">${movies.map(cardHTML).join("")}</div>`;
  bind();
  if (hero) { $("#hPlay").onclick = () => play(hero); $("#hInfo").onclick = () => showInfo(hero); }
  app.querySelectorAll(".rowwrap").forEach(w => {
    const row = w.querySelector(".row");
    w.querySelector(".l").onclick = () => row.scrollBy({ left: -row.clientWidth * 0.85, behavior: "smooth" });
    w.querySelector(".r").onclick = () => row.scrollBy({ left: row.clientWidth * 0.85, behavior: "smooth" });
  });
}
$("#q").oninput = render;

/* ---------- Reproductor ---------- */
function srtToVtt(s){
  return "WEBVTT\n\n" + s.replace(/\r/g, "").replace(/^\uFEFF/, "")
    .replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2").replace(/^\d+\n(?=\d\d:)/gm, "");
}
async function play(m){
  current = m;
  $("#ptitle").textContent = m.title;
  $("#player").classList.add("on");
  try { await document.documentElement.requestFullscreen?.(); } catch {}
  try { await screen.orientation?.lock?.("landscape"); } catch {}
  const stage = $("#stage");
  stage.innerHTML = `<div class="center">Cargando…</div>`;
  try { await ensureToken(); } catch { return; }
  const reg = await swReady;
  if (!reg || !navigator.serviceWorker.controller) {
    stage.innerHTML = `<div class="center">Hay que recargar la página una vez. <button onclick="location.reload()">Recargar</button></div>`;
    return;
  }
  const v = document.createElement("video");
  v.controls = true; v.autoplay = true; v.playsInline = true; v.crossOrigin = "anonymous";
  v.src = "stream/" + m.id;
  for (const s of m.subs) {
    try {
      let txt = await (await api("/files/" + s.id, { alt: "media" })).text();
      if (/\.srt$/i.test(s.name)) txt = srtToVtt(txt);
      const t = document.createElement("track");
      t.kind = "subtitles";
      t.label = (s.name.match(/\.([a-z]{2,3})\.(srt|vtt)$/i) || [, "Subtítulos"])[1];
      t.src = URL.createObjectURL(new Blob([txt], { type: "text/vtt" }));
      if (!v.querySelector("track")) t.default = true;
      v.appendChild(t);
    } catch (e) { console.warn("subtítulo", e); }
  }
  const pos = getProg(m.id).p;
  v.addEventListener("loadedmetadata", () => { if (pos > 10 && pos < v.duration - 30) v.currentTime = pos; }, { once: true });
  v.addEventListener("timeupdate", () => { if (Math.floor(v.currentTime) % 5 === 0) saveNow(); });
  v.addEventListener("ended", () => { setProg(m.id, 0, true); flushProgress(); });
  v.addEventListener("pause", () => { saveNow(); flushProgress(); });
  v.addEventListener("error", () => {
    stage.innerHTML = `<div class="center"><h2>Este archivo no se puede reproducir en el navegador</h2>
      <p>Probablemente es MKV/AVI o usa un códec no compatible. Conviértelo a <b>MP4 (H.264)</b> y vuelve a subirlo.</p></div>`;
  });
  stage.innerHTML = ""; stage.appendChild(v);
}
function saveNow(){
  const v = $("#stage video");
  if (v && current && v.currentTime > 0 && !v.ended) setProg(current.id, v.currentTime, false);
}
$("#btnBack").onclick = () => {
  saveNow(); flushProgress(); $("#stage").innerHTML = ""; $("#player").classList.remove("on");
  try { screen.orientation?.unlock?.(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen?.();
  render();
};
window.addEventListener("pagehide", () => { saveNow(); flushProgress(true); });

/* ---------- Enviar a la TV (Chromecast) ---------- */
let castReady = false, castingMovie = null, rp = null, rpc = null, castSaveTick = 0, lastCastTime = 0;
window.__onGCastApiAvailable = ok => {
  if (!ok) return;
  const ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({ receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                   autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
  rp = new cast.framework.RemotePlayer();
  rpc = new cast.framework.RemotePlayerController(rp);
  const E = cast.framework.RemotePlayerEventType;
  rpc.addEventListener(E.IS_CONNECTED_CHANGED, () => { if (!rp.isConnected) endCastUI(); });
  rpc.addEventListener(E.IS_PAUSED_CHANGED, () => {
    $("#cbPlay").textContent = rp.isPaused ? "▶" : "⏸";
    if (rp.isPaused) { saveCast(); flushProgress(); }
  });
  rpc.addEventListener(E.CURRENT_TIME_CHANGED, () => {
    if (!castingMovie || !rp.duration) return;
    if (rp.currentTime > 0) lastCastTime = rp.currentTime;
    if (!seeking) $("#cbSeek").value = Math.round(rp.currentTime / rp.duration * 1000);
    if (++castSaveTick % 5 === 0) saveCast();
  });
  rpc.addEventListener(E.PLAYER_STATE_CHANGED, () => {
    if (castingMovie && rp.playerState === chrome.cast.media.PlayerState.IDLE && castSaveTick > 10) {
      const finished = rp.duration && lastCastTime > rp.duration - 90;
      if (finished) { setProg(castingMovie.id, 0, true); flushProgress(); castingMovie = null; }
      endCastUI();
    }
  });
  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, () => { castReady = true; });
  castReady = true;
};
function castAvailable(){
  if (!castReady || !window.cast?.framework) return false;
  return cast.framework.CastContext.getInstance().getCastState() !== cast.framework.CastState.NO_DEVICES_AVAILABLE;
}
let seeking = false;
function saveCast(){ if (castingMovie && lastCastTime > 0) setProg(castingMovie.id, lastCastTime, false); }
async function castMovie(m){
  const ctx = cast.framework.CastContext.getInstance();
  try { if (!ctx.getCurrentSession()) await ctx.requestSession(); } catch { return; } // canceló el selector
  const session = ctx.getCurrentSession();
  try {
    const r = await fetch(`${WORKER_URL}/castlink?id=${m.id}&subs=${m.subs.map(s => s.id).join(",")}`,
      { headers: { Authorization: "Bearer " + store.get("session", "") } });
    const link = await r.json();
    if (!r.ok) throw new Error(link.error || r.status);
    const type = /\.webm$/i.test(m.name) ? "video/webm" : /\.mkv$/i.test(m.name) ? "video/x-matroska" : "video/mp4";
    const info = new chrome.cast.media.MediaInfo(link.video, type);
    info.streamType = chrome.cast.media.StreamType.BUFFERED;
    const meta = metaOf(m) || {};
    info.metadata = new chrome.cast.media.MovieMediaMetadata();
    info.metadata.title = meta.title || m.q;
    if (meta.poster) info.metadata.images = [new chrome.cast.Image(meta.poster)];
    info.tracks = link.subs.map((u, i) => {
      const t = new chrome.cast.media.Track(i + 1, chrome.cast.media.TrackType.TEXT);
      t.trackContentId = u; t.trackContentType = "text/vtt";
      t.subtype = chrome.cast.media.TextTrackType.SUBTITLES;
      t.name = (m.subs[i].name.match(/\.([a-z]{2,3})\.(srt|vtt)$/i) || [, "Subtítulos"])[1];
      t.language = "es";
      return t;
    });
    const req = new chrome.cast.media.LoadRequest(info);
    const pr = getProg(m.id);
    req.currentTime = pr.p > 10 && !pr.d ? pr.p : 0;
    req.autoplay = true;
    if (info.tracks.length) req.activeTrackIds = [1];
    await session.loadMedia(req);
    castingMovie = m; castSaveTick = 0; lastCastTime = req.currentTime;
    $("#cbTitle").textContent = meta.title || m.q;
    $("#cbDev").textContent = "📺 En " + (session.getCastDevice().friendlyName || "la TV");
    const img = posterOf(m); $("#cbImg").hidden = !img; if (img) $("#cbImg").src = img;
    $("#cbSeek").max = 1000; $("#cbPlay").textContent = "⏸";
    $("#castBar").classList.add("on"); document.body.classList.add("casting");
  } catch (e) {
    console.error(e);
    alertBox("No se pudo enviar a la TV: " + (e.description || e.message || e.code || e));
  }
}
function endCastUI(){
  saveCast(); flushProgress();
  castingMovie = null; $("#castBar").classList.remove("on"); document.body.classList.remove("casting");
  if (movies.length) render();
}
function alertBox(msg){
  $("#info .box").innerHTML = `<div><p>${esc(msg)}</p><div class="acts"><button id="iClose">Cerrar</button></div></div>`;
  $("#info").classList.add("on"); $("#iClose").onclick = () => $("#info").classList.remove("on");
}
$("#cbPlay").onclick = () => rpc?.playOrPause();
$("#cbBack").onclick = () => { if (rp) { rp.currentTime = Math.max(0, rp.currentTime - 10); rpc.seek(); } };
$("#cbFwd").onclick = () => { if (rp) { rp.currentTime = Math.min(rp.duration - 1, rp.currentTime + 30); rpc.seek(); } };
$("#cbStop").onclick = () => { saveCast(); cast.framework.CastContext.getInstance().endCurrentSession(true); endCastUI(); };
$("#cbSeek").oninput = () => { seeking = true; };
$("#cbSeek").onchange = () => {
  if (rp?.duration) { rp.currentTime = $("#cbSeek").value / 1000 * rp.duration; rpc.seek(); }
  seeking = false;
};

/* ---------- Instalar como app (PWA) ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#btnInstall").hidden = false; });
addEventListener("appinstalled", () => { $("#btnInstall").hidden = true; installEvt = null; });
$("#btnInstall").onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#btnInstall").hidden = true;
};
// iPhone/iPad: Safari no tiene botón de instalar, se muestra cómo hacerlo
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent) && !store.get("iosTipSeen", false)) {
  const tip = document.createElement("div");
  tip.id = "iosTip";
  tip.innerHTML = `Instala Mi Cine: toca <b>Compartir</b> ⬆️ y luego <b>"Agregar a pantalla de inicio"</b>.<button>✕</button>`;
  tip.querySelector("button").onclick = () => { tip.remove(); store.set("iosTipSeen", true); };
  document.body.appendChild(tip);
}

start();
</script>
