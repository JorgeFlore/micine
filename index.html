<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Mi Cine</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--card2:#232731;--txt:#e9ecf1;--mut:#9aa3b2;--acc:#e5484d;--rad:12px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 20px;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222}
  header h1{font-size:20px;margin:0 auto 0 0;letter-spacing:.5px}
  header h1 span{color:var(--acc)}
  #who{color:var(--mut);font-size:13px}
  input[type=search]{background:var(--card);border:1px solid #2c313c;color:var(--txt);border-radius:999px;padding:9px 16px;width:min(320px,40vw);font-size:14px}
  button{background:var(--card2);color:var(--txt);border:1px solid #333a47;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  button:hover{border-color:#566}
  button.pri{background:var(--acc);border-color:var(--acc);font-weight:600}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .center{text-align:center;padding:60px 20px;color:var(--mut)}
  .center h2{color:var(--txt)}
  form.login{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw);margin:24px auto 0}
  form.login input{background:var(--card);border:1px solid #2c313c;color:var(--txt);border-radius:8px;padding:12px;font-size:16px}
  .err{color:#ff8a8d;min-height:1.2em;font-size:14px}
  h3.sec{margin:28px 0 12px;font-size:16px;color:var(--mut);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .card{background:var(--card);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:transform .15s;position:relative}
  .card:hover{transform:translateY(-3px)}
  .poster{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:12px;font-weight:700;font-size:17px;line-height:1.2}
  .meta{padding:8px 12px 12px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
  .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
  #player{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
  #player.on{display:flex}
  #pbar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#111}
  #pbar .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  #stage video{width:100%;height:100%;background:#000}
  @media (max-width:600px){#who{display:none} header{flex-wrap:wrap} input[type=search]{order:9;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Mi <span>Cine</span></h1>
  <input type="search" id="q" placeholder="Buscar película…" hidden>
  <span id="who"></span>
  <button id="btnOut" hidden>Salir</button>
</header>
<main id="app"><div class="center">Cargando…</div></main>

<div id="player">
  <div id="pbar">
    <button id="btnBack">← Volver</button>
    <span class="t" id="ptitle"></span>
  </div>
  <div id="stage"></div>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const WORKER_URL = "https://micine.koke-17-21.workers.dev"; // ej: https://micine.tu-cuenta.workers.dev
/* ======================================= */

const API = "https://www.googleapis.com/drive/v3";
const VIDEO_EXT = /\.(mp4|m4v|mkv|webm|avi|mov|wmv|mpg|mpeg|ts)$/i;

const $ = s => document.querySelector(s);
const app = $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("micine:"+k); return v===null?d:JSON.parse(v);}catch{return d;} },
  set(k, v){ try{ localStorage.setItem("micine:"+k, JSON.stringify(v)); }catch{} }
};

let token = null, tokenExp = 0, folderId = null, user = null, movies = [], current = null;

/* ---------- Service worker (streaming con autorización) ---------- */
const swReady = "serviceWorker" in navigator
  ? navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).catch(e => { console.warn("SW", e); return null; })
  : Promise.resolve(null);
navigator.serviceWorker?.addEventListener("message", async e => {
  if (e.data?.type === "needToken" && e.ports[0]) {
    try { await ensureToken(); } catch {}
    e.ports[0].postMessage(token);
  }
});
async function sendTokenToSW(){
  const reg = await swReady;
  const sw = reg && (reg.active || navigator.serviceWorker.controller);
  if (sw) sw.postMessage({ type: "token", token });
}

/* ---------- Sesión con usuario propio ---------- */
async function ensureToken(){
  if (token && Date.now() < tokenExp) return;
  const session = store.get("session", null);
  if (!session) { showLogin(); throw new Error("nologin"); }
  const r = await fetch(WORKER_URL + "/token", { headers: { Authorization: "Bearer " + session } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout("Tu sesión expiró. Vuelve a entrar."); throw new Error("nologin"); }
  if (!r.ok) throw new Error(j.error || ("Servidor " + r.status));
  token = j.access_token; tokenExp = Date.now() + (j.expires_in - 60) * 1000;
  folderId = j.folder; user = j.user;
  await sendTokenToSW();
}
function showLogin(msg){
  ["#q","#btnOut"].forEach(s => $(s).hidden = true); $("#who").textContent = "";
  app.innerHTML = `<div class="center"><h2>Bienvenido a Mi Cine</h2>
    <form class="login" id="flogin" autocomplete="on">
      <input id="lu" name="username" placeholder="Usuario" autocomplete="username" autocapitalize="none" required>
      <input id="lp" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="pri" type="submit">Entrar</button>
      <div class="err" id="lerr">${msg || ""}</div>
    </form></div>`;
  $("#flogin").onsubmit = async e => {
    e.preventDefault();
    $("#lerr").textContent = "Entrando…";
    try {
      const r = await fetch(WORKER_URL + "/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: $("#lu").value, pass: $("#lp").value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $("#lerr").textContent = j.error || "No se pudo entrar"; return; }
      store.set("session", j.session);
      start();
    } catch { $("#lerr").textContent = "No hay conexión con el servidor."; }
  };
}
function logout(msg){
  store.set("session", null); token = null; tokenExp = 0; sendTokenToSW();
  showLogin(msg);
}
$("#btnOut").onclick = () => logout("Sesión cerrada.");

/* ---------- Drive API ---------- */
async function api(path, params = {}, retry = true){
  await ensureToken();
  const r = await fetch(API + path + "?" + new URLSearchParams(params), { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401 && retry) { token = null; return api(path, params, false); }
  if (!r.ok) throw new Error("Drive " + r.status + ": " + (await r.text()).slice(0, 200));
  return r;
}
async function listChildren(id){
  let out = [], pageToken;
  do {
    const p = { q: `'${id}' in parents and trashed=false`, pageSize: 1000,
      fields: "nextPageToken,files(id,name,mimeType,size,videoMediaMetadata(durationMillis))",
      supportsAllDrives: true, includeItemsFromAllDrives: true };
    if (pageToken) p.pageToken = pageToken;
    const j = await (await api("/files", p)).json();
    out.push(...j.files); pageToken = j.nextPageToken;
  } while (pageToken);
  return out;
}
async function scan(id, depth = 0, acc = { videos: [], subs: [] }){
  const items = await listChildren(id), sub = [];
  for (const f of items) {
    if (f.mimeType === "application/vnd.google-apps.folder") { if (depth < 4) sub.push(scan(f.id, depth + 1, acc)); }
    else if (f.mimeType.startsWith("video/") || VIDEO_EXT.test(f.name)) acc.videos.push({ ...f, folder: id });
    else if (/\.(srt|vtt)$/i.test(f.name)) acc.subs.push({ ...f, folder: id });
  }
  await Promise.all(sub);
  return acc;
}

/* ---------- Biblioteca ---------- */
async function start(){
  if (WORKER_URL.startsWith("PEGA_")) {
    app.innerHTML = `<div class="center"><h2>Falta configurar</h2><p>Pega la URL del Worker en <code>WORKER_URL</code> dentro de index.html.</p></div>`;
    return;
  }
  if (!store.get("session", null)) return showLogin();
  app.innerHTML = `<div class="center">Cargando tus películas…</div>`;
  try {
    await ensureToken();
    ["#q","#btnOut"].forEach(s => $(s).hidden = false);
    $("#who").textContent = "👤 " + user;
    const { videos, subs } = await scan(folderId);
    movies = videos.map(v => {
      const base = v.name.replace(/\.[^.]+$/, "");
      const here = subs.filter(s => s.folder === v.folder);
      const exact = here.filter(s => s.name.toLowerCase().startsWith(base.toLowerCase()));
      const alone = videos.filter(x => x.folder === v.folder).length === 1;
      return { ...v, title: cleanTitle(base), subs: exact.length ? exact : (alone ? here : []) };
    }).sort((a, b) => a.title.localeCompare(b.title, "es"));
    render();
  } catch (e) {
    if (e.message === "nologin") return;
    console.error(e);
    app.innerHTML = `<div class="center"><h2>No pude cargar las películas</h2><p>${esc(e.message)}</p><button onclick="start()">Reintentar</button></div>`;
  }
}
function cleanTitle(s){
  return s.replace(/[._]/g, " ")
    .replace(/\b(1080p|720p|2160p|4k|x264|x265|h264|h265|hevc|bluray|brrip|webrip|web-dl|hdrip|dvdrip|aac|ac3|dts|latino|castellano|dual|subs?)\b.*$/i, "")
    .replace(/\s+/g, " ").trim();
}
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function fmtSize(b){ b = +b || 0; return b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB"; }
function fmtDur(ms){ if (!ms) return ""; const m = Math.round(ms / 60000); return Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const posKey = id => "pos:" + user + ":" + id;
const doneKey = id => "done:" + user + ":" + id;

function cardHTML(m){
  const p = store.get(posKey(m.id), 0);
  const dur = +m.videoMediaMetadata?.durationMillis || 0;
  const pct = p && dur ? Math.min(100, p * 1000 / dur * 100) : 0;
  const h = hue(m.title);
  return `<div class="card" data-id="${m.id}">
    <div class="poster" style="background:linear-gradient(160deg,hsl(${h} 45% 32%),hsl(${(h + 40) % 360} 50% 14%))">${esc(m.title)}</div>
    <div class="meta"><span>${fmtDur(dur)}</span><span>${fmtSize(m.size)}</span></div>
    ${pct ? `<div class="prog" style="width:${pct}%"></div>` : ""}</div>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const list = movies.filter(m => !q || m.title.toLowerCase().includes(q));
  if (!movies.length) { app.innerHTML = `<div class="center"><h2>Todavía no hay películas</h2><p>Súbelas a la carpeta de Drive y recarga.</p></div>`; return; }
  const cont = list.filter(m => store.get(posKey(m.id), 0) > 60 && !store.get(doneKey(m.id), false));
  app.innerHTML =
    (cont.length && !q ? `<h3 class="sec">Seguir viendo</h3><div class="grid">${cont.map(cardHTML).join("")}</div>` : "") +
    `<h3 class="sec">${q ? "Resultados" : "Todas"} (${list.length})</h3><div class="grid">${list.map(cardHTML).join("")}</div>`;
  app.querySelectorAll(".card").forEach(c => c.onclick = () => play(movies.find(m => m.id === c.dataset.id)));
}
$("#q").oninput = render;

/* ---------- Reproductor ---------- */
function srtToVtt(s){
  return "WEBVTT\n\n" + s.replace(/\r/g, "").replace(/^\uFEFF/, "")
    .replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2").replace(/^\d+\n(?=\d\d:)/gm, "");
}
async function play(m){
  current = m;
  $("#ptitle").textContent = m.title;
  $("#player").classList.add("on");
  try { await document.documentElement.requestFullscreen?.(); } catch {}
  const stage = $("#stage");
  stage.innerHTML = `<div class="center">Cargando…</div>`;
  try { await ensureToken(); } catch { return; }
  const reg = await swReady;
  if (!reg || !navigator.serviceWorker.controller) {
    stage.innerHTML = `<div class="center">Hay que recargar la página una vez. <button onclick="location.reload()">Recargar</button></div>`;
    return;
  }
  const v = document.createElement("video");
  v.controls = true; v.autoplay = true; v.playsInline = true; v.crossOrigin = "anonymous";
  v.src = "stream/" + m.id;
  for (const s of m.subs) {
    try {
      let txt = await (await api("/files/" + s.id, { alt: "media" })).text();
      if (/\.srt$/i.test(s.name)) txt = srtToVtt(txt);
      const t = document.createElement("track");
      t.kind = "subtitles";
      t.label = (s.name.match(/\.([a-z]{2,3})\.(srt|vtt)$/i) || [, "Subtítulos"])[1];
      t.src = URL.createObjectURL(new Blob([txt], { type: "text/vtt" }));
      if (!v.querySelector("track")) t.default = true;
      v.appendChild(t);
    } catch (e) { console.warn("subtítulo", e); }
  }
  const pos = store.get(posKey(m.id), 0);
  v.addEventListener("loadedmetadata", () => { if (pos > 10 && pos < v.duration - 30) v.currentTime = pos; }, { once: true });
  v.addEventListener("timeupdate", () => { if (Math.floor(v.currentTime) % 5 === 0) saveNow(); });
  v.addEventListener("ended", () => { store.set(doneKey(m.id), true); store.set(posKey(m.id), 0); });
  v.addEventListener("error", () => {
    stage.innerHTML = `<div class="center"><h2>Este archivo no se puede reproducir en el navegador</h2>
      <p>Probablemente es MKV/AVI o usa un códec no compatible. Conviértelo a <b>MP4 (H.264)</b> y vuelve a subirlo.</p></div>`;
  });
  stage.innerHTML = ""; stage.appendChild(v);
}
function saveNow(){
  const v = $("#stage video");
  if (v && current && v.currentTime > 0) store.set(posKey(current.id), Math.floor(v.currentTime));
}
$("#btnBack").onclick = () => {
  saveNow(); $("#stage").innerHTML = ""; $("#player").classList.remove("on");
  if (document.fullscreenElement) document.exitFullscreen?.();
  render();
};
window.addEventListener("pagehide", saveNow);

start();
</script>
</body>
</html>
